<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" aria-label="Logo IFMG Campus Ouro Branco">
  <!-- Simbolo do Instituto Federal -->
  <g transform="translate(4, 8)">
    <!-- Circulo vermelho no topo esquerdo -->
    <circle cx="9" cy="9" r="9" fill="#C8102E" />
    
    <!-- Quadrados e retangulos verdes caracteristicos da marca IF -->
    <!-- Coluna 1 -->
    <rect x="0" y="24" width="18" height="18" rx="3.5" fill="#006633" />
    <rect x="0" y="47" width="18" height="18" rx="3.5" fill="#006633" />
    
    <!-- Coluna 2 -->
    <rect x="23" y="0" width="18" height="18" rx="3.5" fill="#006633" />
    <rect x="23" y="24" width="18" height="18" rx="3.5" fill="#006633" />
    <rect x="23" y="47" width="18" height="18" rx="3.5" fill="#006633" />
    
    <!-- Coluna 3 -->
    <rect x="46" y="0" width="18" height="18" rx="3.5" fill="#006633" />
    <rect x="46" y="24" width="18" height="18" rx="3.5" fill="#006633" />
    <rect x="46" y="47" width="18" height="18" rx="3.5" fill="#006633" />
  </g>

  <!-- Tipografia Institucional -->
  <g transform="translate(80, 26)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="16" font-weight="800" fill="#006633" letter-spacing="0.5">INSTITUTO FEDERAL</text>
    <text x="0" y="18" font-size="14" font-weight="600" fill="#333333">Minas Gerais</text>
    <text x="0" y="34" font-size="11" font-weight="500" fill="#666666">Campus Ouro Branco</text>
  </g>
</svg>
